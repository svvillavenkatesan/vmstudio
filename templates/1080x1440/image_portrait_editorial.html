<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="template:media-width" content="900">
<meta name="template:media-height" content="1200">
<meta name="viewport" content="width=1080, height=1440">
<title>Portrait Editorial - 1080x1440</title>
<style>
@font-face { font-family:"Noto Tamil"; src:url("../../resources/fonts/NotoSansTamil-Regular.ttf"); }
* { box-sizing:border-box; margin:0; padding:0; }
html,body { width:1080px; height:1440px; overflow:hidden; }
body { background:linear-gradient(160deg,#fff7ed,#f2d5b5); color:#362417; font-family:"Noto Tamil","Nirmala UI",sans-serif; padding:56px 70px; }
.title { height:145px; display:flex; align-items:center; justify-content:center; text-align:center; font-size:48px; font-weight:700; line-height:1.3; }
.media { width:940px; height:1040px; border:12px solid #fffaf3; border-radius:30px; overflow:hidden; box-shadow:0 18px 50px #5b392944; }
.media img { width:100%; height:100%; object-fit:cover; }
.text { height:143px; display:flex; align-items:center; justify-content:center; text-align:center; font-size:27px; line-height:1.55; padding:18px 45px; }
</style>
</head>
<body><div class="title">{{title}}</div><div class="media"><img src="{{image}}" alt="Scene image"></div><div class="text">{{text}}</div></body>
</html>
