<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="template:media-width" content="900">
<meta name="template:media-height" content="1200">
<meta name="viewport" content="width=1080, height=1440">
<title>Portrait Editorial Video - 1080x1440</title>
<style>
@font-face { font-family:"Noto Tamil"; src:url("../../resources/fonts/NotoSansTamil-Regular.ttf"); }
* { box-sizing:border-box; margin:0; padding:0; }
html,body { width:1080px; height:1440px; overflow:hidden; background:transparent; }
body { color:#fff; font-family:"Noto Tamil","Nirmala UI",sans-serif; }
.main { width:1080px; height:1440px; padding:56px 70px; background:linear-gradient(160deg,#21160f,#543a2a); }
.title { height:145px; display:flex; align-items:center; justify-content:center; text-align:center; font-size:48px; font-weight:700; line-height:1.3; text-shadow:0 3px 12px #000; }
.video-overlay { width:940px; height:1040px; border-radius:30px; box-shadow:0 18px 50px #0009; }
.text { height:143px; display:flex; align-items:center; justify-content:center; text-align:center; font-size:27px; line-height:1.55; padding:18px 45px; text-shadow:0 3px 10px #000; }
</style>
</head>
<body><div class="main"><div class="title">{{title}}</div><div class="video-overlay"></div><div class="text">{{text}}</div></div></body>
</html>
