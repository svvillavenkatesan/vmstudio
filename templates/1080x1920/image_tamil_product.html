<!DOCTYPE html>
<html lang="ta"><head><meta charset="UTF-8">
<meta name="template:media-width" content="512"><meta name="template:media-height" content="768">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden}body{background:#090b10;color:#fff;font-family:"Noto Sans Tamil",sans-serif}.page{height:100%;padding:58px;display:flex;flex-direction:column;gap:28px;background:radial-gradient(circle at 80% 15%,#6b5cff66,transparent 30%),radial-gradient(circle at 15% 85%,#00d6b555,transparent 28%),#090b10}.brand{display:flex;justify-content:space-between;color:#b9b4ff;font-size:23px;font-weight:800;letter-spacing:3px}.title{font-size:75px;line-height:1.19;font-weight:900;max-height:270px}.media{height:970px;border-radius:42px;overflow:hidden;background:linear-gradient(135deg,#23283b,#121521);border:2px solid #ffffff33;box-shadow:0 25px 70px #000}.media img{width:100%;height:100%;object-fit:cover}.text{flex:1;border-radius:32px;background:#ffffff0f;border:2px solid #ffffff22;padding:40px;display:flex;align-items:center;font-size:42px;line-height:1.62;font-weight:650}.cta{height:100px;border-radius:50px;background:linear-gradient(90deg,#6b5cff,#00bfa5);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;letter-spacing:2px}
</style></head><body><main class="page"><div class="brand"><span>VMStudio · PRODUCT</span><span>✦</span></div><div class="title">{{title}}</div><section class="media"><img src="{{image}}" alt="தயாரிப்பு காட்சி"></section><section class="text">{{text}}</section><footer class="cta">மேலும் அறியுங்கள்</footer></main></body></html>
