<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="template:media-width" content="1">
    <meta name="template:media-height" content="1">
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
        body { font-family: "Nirmala UI", "Latha", "Noto Serif Tamil", serif; color: #fff9e8;
               background: linear-gradient(155deg, #23140f 0%, #5f2f25 56%, #b96a34 100%); }
        .page { height: 100%; padding: 120px 95px 90px; display: flex; flex-direction: column; justify-content: space-between;
                background: radial-gradient(circle at 18% 10%, #f3c47855 0, transparent 25%), radial-gradient(circle at 85% 89%, #f7df9b44 0, transparent 28%); }
        .ornament { font-size: 45px; color: #f4ca78; letter-spacing: 23px; text-align: center; }
        .title { color: #f6d99a; font-size: 76px; line-height: 1.3; text-align: center; font-weight: 800; overflow-wrap: anywhere; }
        .poem { border-top: 2px solid #f5cb79aa; border-bottom: 2px solid #f5cb79aa; padding: 75px 38px;
                text-align: center; font-size: 55px; font-weight: 500; line-height: 1.95; overflow-wrap: anywhere; }
        .signature { text-align: center; color: #f4ca78; font-size: 25px; letter-spacing: 5px; }
    </style>
</head>
<body>
    <main class="page">
        <div class="ornament">✦ ◇ ✦</div>
        <div class="title">{{title}}</div>
        <div class="poem">{{text}}</div>
        <div class="signature">VMStudio · தமிழ் கவிதை</div>
    </main>
</body>
</html>
