<!DOCTYPE html>
<html lang="ta"><head><meta charset="UTF-8">
<meta name="template:media-width" content="512"><meta name="template:media-height" content="768">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden}body{background:#e9dfca;color:#261e16;font-family:"Noto Serif Tamil",serif}.page{height:100%;padding:64px;display:flex;flex-direction:column;gap:30px;background:linear-gradient(90deg,#6e512511 1px,transparent 1px),#eee4d1;background-size:54px 54px}.era{color:#7d3b20;font-size:23px;font-weight:800;letter-spacing:4px}.title{font-size:72px;line-height:1.25;font-weight:900;border-bottom:4px double #7d3b20;padding-bottom:24px}.media{height:920px;position:relative;padding:18px;background:#3b2b20;box-shadow:0 18px 40px #2a1a1044}.media img{width:100%;height:100%;object-fit:cover;filter:saturate(.8) contrast(1.04)}.seal{position:absolute;right:38px;bottom:38px;width:110px;height:110px;border:4px double #f2d188;border-radius:50%;display:grid;place-items:center;color:#f2d188;font-size:32px;background:#582814cc}.text{flex:1;background:#f9f1df;border:1px solid #9b7b51;padding:42px;display:flex;align-items:center;font-size:43px;line-height:1.72;font-weight:650}.footer{display:flex;justify-content:space-between;color:#7d3b20;font-size:23px;font-weight:800}
</style></head><body><main class="page"><div class="era">VMStudio · தமிழ் வரலாறு</div><div class="title">{{title}}</div><section class="media"><img src="{{image}}" alt="வரலாற்றுக் காட்சி"><div class="seal">✦</div></section><section class="text">{{text}}</section><footer class="footer"><span>காலம் · சான்று · மரபு</span><span>தமிழக வரலாறு</span></footer></main></body></html>
