<!DOCTYPE html>
<html lang="ta"><head><meta charset="UTF-8">
<meta name="template:media-width" content="512"><meta name="template:media-height" content="768">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden}body{background:#17120d;color:#f4dfb0;font-family:"Noto Serif Tamil",serif}.page{height:100%;padding:70px 72px;display:flex;flex-direction:column;gap:34px;background:linear-gradient(#17120ddd,#2b1c10ee),radial-gradient(circle,#9b7028,transparent)}.brand{color:#d8ad58;font-size:23px;letter-spacing:4px;text-align:center}.ornament{text-align:center;color:#bd873e;font-size:33px;letter-spacing:18px}.title{font-size:68px;line-height:1.28;text-align:center;font-weight:800}.media{height:720px;margin:0 42px;overflow:hidden;border:3px solid #a77a38;padding:13px;background:#f1dbac}.media img{width:100%;height:100%;object-fit:cover;filter:sepia(.18)}.text{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:48px;border-top:2px solid #9d7438;border-bottom:2px solid #9d7438;font-size:49px;line-height:1.75;font-weight:700}.footer{text-align:center;color:#c7984d;font-size:25px;letter-spacing:3px}
</style></head><body><main class="page"><div class="brand">VMStudio · திருக்குறள்</div><div class="ornament">❖ ✦ ❖</div><div class="title">{{title}}</div><section class="media"><img src="{{image}}" alt="கருத்துக் காட்சி"></section><section class="text">{{text}}</section><footer class="footer">அறம் · பொருள் · இன்பம்</footer></main></body></html>
