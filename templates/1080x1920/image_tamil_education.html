<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="template:media-width" content="1024">
    <meta name="template:media-height" content="1024">
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
        body { font-family: "Nirmala UI", "Latha", "Noto Sans Tamil", sans-serif; background: #eef4f7; color: #132d42; }
        .page { height: 100%; padding: 65px; display: flex; flex-direction: column; gap: 32px; border-top: 18px solid #138a9e; }
        .eyebrow { color: #138a9e; font-size: 23px; font-weight: 800; letter-spacing: 3px; }
        .title { font-size: 67px; line-height: 1.24; font-weight: 850; overflow-wrap: anywhere; }
        .media { height: 800px; border-radius: 28px; overflow: hidden; box-shadow: 0 12px 35px #14324633; background: #c9e4eb; }
        .media img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .text { flex: 1; border-radius: 28px; background: #ffffff; padding: 42px; display: flex; align-items: center;
                font-size: 45px; line-height: 1.72; font-weight: 600; overflow-wrap: anywhere; box-shadow: 0 8px 24px #14324618; }
        .footer { display: flex; justify-content: space-between; color: #138a9e; font-size: 24px; font-weight: 800; }
    </style>
</head>
<body>
    <main class="page">
        <header><div class="eyebrow">VILLVA MEDIA STUDIO · தமிழ் கல்வி</div><div class="title">{{title}}</div></header>
        <section class="media"><img src="{{image}}" alt="விளக்கக் காட்சி"></section>
        <section class="text">{{text}}</section>
        <footer class="footer"><span>கற்றல் · சிந்தனை · வளர்ச்சி</span><span>✦</span></footer>
    </main>
</body>
</html>
