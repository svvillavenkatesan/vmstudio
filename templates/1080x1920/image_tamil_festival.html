<!DOCTYPE html>
<html lang="ta"><head><meta charset="UTF-8">
<meta name="template:media-width" content="512"><meta name="template:media-height" content="768">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden}body{background:#fff3ce;color:#54220d;font-family:"Noto Sans Tamil",sans-serif}.page{height:100%;padding:58px 62px;display:flex;flex-direction:column;gap:28px;background:radial-gradient(circle at 0 0,#f8b83f88,transparent 25%),linear-gradient(155deg,#fff8dc,#f7c956)}.top{display:flex;justify-content:space-between;align-items:center;color:#a84216;font-weight:800;font-size:24px}.kolam{letter-spacing:13px}.title{font-size:76px;line-height:1.2;font-weight:900;text-align:center;padding:20px 10px}.media{height:970px;border-radius:180px 180px 28px 28px;overflow:hidden;border:12px solid #fff8de;box-shadow:0 22px 50px #6f2b1e55}.media img{width:100%;height:100%;object-fit:cover}.text{flex:1;background:#fffaf0dd;border:3px solid #d95c23;border-radius:30px;padding:34px 42px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:43px;line-height:1.65;font-weight:650}.footer{text-align:center;color:#a84216;font-size:24px;font-weight:800;letter-spacing:3px}
</style></head><body><main class="page"><div class="top"><span>VMStudio · தமிழ் விழா</span><span class="kolam">✦ ◇ ✦</span></div><div class="title">{{title}}</div><section class="media"><img src="{{image}}" alt="விழா காட்சி"></section><section class="text">{{text}}</section><footer class="footer">மரபு · மகிழ்ச்சி · ஒற்றுமை</footer></main></body></html>
