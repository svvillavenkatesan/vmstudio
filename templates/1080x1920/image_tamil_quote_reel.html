<!DOCTYPE html>
<html lang="ta"><head><meta charset="UTF-8">
<meta name="template:media-width" content="512"><meta name="template:media-height" content="768">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden}body{background:#111;color:#fff;font-family:"Noto Sans Tamil",sans-serif}.page{height:100%;position:relative;background:#222}.media{position:absolute;inset:0}.media img{width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(180deg,#0008 0,#0001 28%,#0004 55%,#000e 100%)}.content{position:absolute;inset:0;padding:70px 64px 130px;display:flex;flex-direction:column}.brand{font-size:24px;font-weight:800;letter-spacing:4px}.spacer{flex:1}.quote{font-family:"Noto Serif Tamil",serif;font-size:65px;line-height:1.43;font-weight:800;text-shadow:0 4px 16px #000;text-wrap:balance}.line{width:130px;height:8px;background:#ffd54f;margin:35px 0}.text{font-size:39px;line-height:1.65;font-weight:600;color:#f6f6f6;text-shadow:0 3px 10px #000}.footer{margin-top:45px;display:flex;justify-content:space-between;color:#ffd54f;font-size:23px;font-weight:800}
</style></head><body><main class="page"><section class="media"><img src="{{image}}" alt="பின்னணிக் காட்சி"></section><div class="shade"></div><section class="content"><div class="brand">VMStudio · தமிழ் REEL</div><div class="spacer"></div><div class="quote">{{title}}</div><div class="line"></div><div class="text">{{text}}</div><footer class="footer"><span>சிந்தனை · ஊக்கம்</span><span>✦</span></footer></section></main></body></html>
