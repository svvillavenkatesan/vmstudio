<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="template:media-width" content="1024">
    <meta name="template:media-height" content="1024">
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
        body { font-family: "Nirmala UI", "Latha", "Noto Sans Tamil", sans-serif; color: #fffaf0; background: #111b28; }
        .page { height: 100%; padding: 72px 62px 55px; display: flex; flex-direction: column; gap: 30px;
                background: linear-gradient(160deg, #111b28, #233f52 60%, #785334); }
        .tag { display: inline-block; align-self: flex-start; color: #ffe3a1; border: 1px solid #ffe3a1aa; border-radius: 999px; padding: 10px 20px; font-size: 22px; font-weight: 700; letter-spacing: 2px; }
        .title { font-size: 70px; line-height: 1.27; font-weight: 850; overflow-wrap: anywhere; }
        .media { height: 880px; border-radius: 38px; overflow: hidden; border: 2px solid #ffe3a155; box-shadow: 0 22px 55px #0008; }
        .media img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .text { flex: 1; display: flex; align-items: center; border-left: 7px solid #ffe3a1; padding: 24px 35px;
                font-size: 46px; line-height: 1.7; font-weight: 550; overflow-wrap: anywhere; }
        .footer { color: #ffe3a1; font-size: 23px; letter-spacing: 3px; font-weight: 700; }
    </style>
</head>
<body>
    <main class="page">
        <div class="tag">VMStudio</div>
        <div class="title">{{title}}</div>
        <section class="media"><img src="{{image}}" alt="கதை காட்சி"></section>
        <section class="text">{{text}}</section>
        <footer class="footer">தமிழில் ஒரு கதை · தொடருங்கள்</footer>
    </main>
</body>
</html>
