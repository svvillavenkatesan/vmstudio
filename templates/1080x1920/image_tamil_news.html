<!DOCTYPE html>
<html lang="ta"><head><meta charset="UTF-8">
<meta name="template:media-width" content="512"><meta name="template:media-height" content="768">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden}body{background:#f4f6fa;color:#101927;font-family:"Noto Sans Tamil",sans-serif}.page{height:100%;display:flex;flex-direction:column}.mast{height:150px;background:#092b55;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 60px}.logo{font-size:34px;font-weight:900}.live{background:#e32332;border-radius:8px;padding:11px 20px;font-size:22px;font-weight:800}.headline{padding:48px 62px 38px;border-bottom:8px solid #e32332;font-size:69px;line-height:1.24;font-weight:900;min-height:250px}.media{height:920px;background:#cbd5e2}.media img{width:100%;height:100%;object-fit:cover}.text{flex:1;margin:42px 58px 34px;border-left:12px solid #e32332;background:#fff;padding:38px 40px;display:flex;align-items:center;font-size:43px;line-height:1.65;font-weight:600;box-shadow:0 10px 35px #10284a22}.ticker{height:105px;background:#092b55;color:#fff;padding:0 60px;display:flex;align-items:center;font-size:25px;font-weight:750;letter-spacing:1px}
</style></head><body><main class="page"><header class="mast"><div class="logo">VMStudio செய்திகள்</div><div class="live">சுருக்கம்</div></header><div class="headline">{{title}}</div><section class="media"><img src="{{image}}" alt="செய்திக் காட்சி"></section><section class="text">{{text}}</section><footer class="ticker">தெளிவான தகவல் · நடுநிலையான விளக்கம்</footer></main></body></html>
