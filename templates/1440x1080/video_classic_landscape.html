<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="template:media-width" content="1280">
<meta name="template:media-height" content="720">
<meta name="viewport" content="width=1440, height=1080">
<title>Classic Landscape Video - 1440x1080</title>
<style>
@font-face { font-family:"Noto Tamil"; src:url("../../resources/fonts/NotoSansTamil-Regular.ttf"); }
* { box-sizing:border-box; margin:0; padding:0; }
html,body { width:1440px; height:1080px; overflow:hidden; background:transparent; }
body { color:#fff; font-family:"Noto Tamil","Nirmala UI",sans-serif; }
.main { position:relative; width:1440px; height:1080px; background:linear-gradient(145deg,#101827,#243b55); padding:54px 72px; }
.title { height:130px; display:flex; align-items:center; justify-content:center; text-align:center; font-size:52px; font-weight:700; line-height:1.25; text-shadow:0 3px 12px #000; }
.video-overlay { width:1280px; height:720px; border-radius:28px; box-shadow:0 18px 55px #0008; }
.text { height:150px; display:flex; align-items:center; justify-content:center; text-align:center; font-size:30px; line-height:1.5; padding:20px 70px; text-shadow:0 3px 10px #000; }
</style>
</head>
<body><div class="main"><div class="title">{{title}}</div><div class="video-overlay"></div><div class="text">{{text}}</div></div></body>
</html>
