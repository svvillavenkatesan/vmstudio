<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="template:media-width" content="1280">
<meta name="template:media-height" content="720">
<meta name="viewport" content="width=1440, height=1080">
<title>Classic Landscape - 1440x1080</title>
<style>
@font-face { font-family: "Noto Tamil"; src: url("../../resources/fonts/NotoSansTamil-Regular.ttf"); }
* { box-sizing:border-box; margin:0; padding:0; }
html,body { width:1440px; height:1080px; overflow:hidden; }
body { background:linear-gradient(145deg,#101827,#243b55); color:#fff; font-family:"Noto Tamil","Nirmala UI",sans-serif; padding:54px 72px; }
.title { height:130px; display:flex; align-items:center; justify-content:center; text-align:center; font-size:52px; font-weight:700; line-height:1.25; }
.media { width:100%; height:720px; border-radius:28px; overflow:hidden; box-shadow:0 18px 55px #0008; background:#0c1422; }
.media img { width:100%; height:100%; object-fit:cover; }
.text { height:150px; display:flex; align-items:center; justify-content:center; text-align:center; font-size:30px; line-height:1.5; padding:20px 70px; }
</style>
</head>
<body>
<div class="title">{{title}}</div>
<div class="media"><img src="{{image}}" alt="Scene image"></div>
<div class="text">{{text}}</div>
</body>
</html>
